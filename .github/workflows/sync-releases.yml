name: Sync GoHarness releases

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release-catalogs
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read the public stable releases
        run: |
          npm run refresh:engine
          npm run refresh:downloads
      - name: Commit changed catalogs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add data/engine.json data/downloads.json
          if git diff --cached --quiet; then
            echo "The release catalogs are current."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Sync published GoHarness releases'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
